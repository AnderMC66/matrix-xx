name: matr_u
description: "Matrix U — preparación para el examen de admisión de la UNSA."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.17.2

  # El único motor de fórmulas. Cubre 12 662 de las 13 720 del banco; las
  # 1 058 que fallan ya están rotas en el origen — ver LEEME.md, «Las
  # fórmulas».
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0

  # Tres dependencias del andamiaje inicial se quitaron el 2026-09-10 porque
  # ningún archivo las importaba, comprobado con
  # `grep -rn "package:<nombre>" lib test`:
  #
  #   cupertino_icons        del `flutter create`; la app usa Material entero
  #   flutter_markdown_plus  el markdown de teoría lo analiza
  #                          `lib/datos/markdown_teoria.dart`, que existe
  #                          justo porque un motor genérico partía las
  #                          fórmulas multilínea
  #   go_router              la navegación es `Navigator.push` y una
  #                          `NavigationBar`; nunca hubo rutas con nombre
  #
  # Si alguna vuelve a hacer falta, vuelve con el archivo que la usa en el
  # mismo commit.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Solo para test/integracion/supabase_real_test.dart. `flutter_test` corre
  # con `TestWidgetsFlutterBinding`, que intercepta TODO HttpClient y fuerza
  # 400 en cada petición —protección del framework contra que un widget test
  # llame a la red por accidente—, así que ese archivo usa `package:test` +
  # el paquete base `supabase` (sin el wrapper de Flutter) en vez de
  # `supabase_flutter`: fuera de ese binding, la petición sí sale de verdad.
  test: ^1.25.0
  supabase: ^2.16.1

  # Solo para test/simulacro_consulta_test.dart, que inyecta un `http.Client`
  # falso en `SupabaseClient` para leer la URL que la app construye de verdad
  # sin tocar la red. Ya venía como dependencia transitiva de `supabase`;
  # se declara porque un archivo la importa por su nombre.
  http: ^1.2.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Solo se usa una vez, para generar los mipmap desde assets/marca/icono.png
  # (ver la sección `flutter_launcher_icons` más abajo). No la corre la app en
  # tiempo de ejecución: se queda como dependencia de desarrollo por si el
  # ícono cambia y hay que regenerar.
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # El catálogo (temario, teoría, preguntas) viaja dentro del binario, no se
  # descarga. Son ~6 MB de JSON, el mismo contenido que en la web sirve
  # `data/**/*.json` — pero aquí no hay servidor Node que lo lea del disco.
  #
  # Las 3 590 figuras de teoría (83 MB) NO están aquí a propósito: eso no
  # entra en un APK. Se piden por red al mismo sitio que las sirve a la web
  # —ver LEEME.md, «Las figuras»— así que solo viaja el nombre de archivo.
  #
  # Se refresca con:  node tool/sincronizar-datos.mjs
  # `assets/formulas_banco.json` NO está en esta lista, y es a propósito. Es
  # la salida de `tool/extraer-formulas.mjs`: 1,4 MB con las 13 720 fórmulas
  # del banco, que solo lee `test/medir_formulas_test.dart` —y lo hace con
  # `File(...)`, del disco, no con `rootBundle`—. Declararlo aquí lo metía en
  # cada APK sin que ninguna línea de `lib/` lo abriera, y de paso rompía el
  # arranque en una copia recién clonada: el archivo está en .gitignore y
  # `sincronizar-datos.mjs` no lo genera, así que Flutter fallaba con «unable
  # to find asset» hasta que alguien corriera la herramienta de medición.
  assets:
    - assets/figuras_rotas.json
    - assets/datos/temario/
    - assets/datos/teoria/
    - assets/datos/preguntas/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# El ícono real de la marca (el mismo `ICONO.png` que usa el repo web, copiado
# a assets/marca/icono.png porque este proyecto no puede depender de una ruta
# en otra máquina). Es el lockup completo -M sobre arco, "Matrix U" debajo-,
# no un glifo aislado: no existe una versión solo-glifo en el repo de origen,
# y recortar una no es una decisión de diseño que corresponda tomar aquí. Se
# ve nítido en el selector de apps y en el ícono grande de ajustes; a 48dp
# (el tamaño real del launcher) el texto se lee como textura, no como palabra
# — el mismo trato que ya recibe en la pestaña del navegador de la web.
#
# Regenerar tras cambiar el archivo:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false # no hay build de iOS en este repo todavía — ver LEEME.md
  image_path: assets/marca/icono.png
