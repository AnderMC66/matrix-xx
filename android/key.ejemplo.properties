# Plantilla de la firma de release. Copiar a android/key.properties (que está
# en .gitignore) y rellenar. Sin este archivo, `flutter build apk --release`
# sigue funcionando pero firma con la clave de depuración, que Play rechaza.
#
# Crear el almacén una sola vez —y GUARDARLO: si se pierde, no hay forma de
# publicar una actualización de esta app nunca más, hay que empezar con otro
# applicationId y los instalados se quedan atrás:
#
#   keytool -genkey -v -keystore ~/matrix-u-release.jks \
#     -keyalg RSA -keysize 2048 -validity 10000 -alias matrix-u
#
# storeFile admite ruta absoluta o relativa a android/app/.

storeFile=C:/Users/<usuario>/matrix-u-release.jks
storePassword=
keyAlias=matrix-u
keyPassword=
